spring.application.name=emp_crud

#spring.datasource.url=jdbc:postgresql://localhost:5432/emp_db
#spring.datasource.username=postgres
#spring.datasource.password=postgres
#spring.datasource.driver-class-name=org.postgresql.Driver

spring.datasource.url=jdbc:postgresql://localhost:5432/emp_db
spring.datasource.username=postgres
spring.datasource.password=${DB_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.open-in-view=false


# AI module (keep the API key in an environment variable, never in source control)
# Provider configuration is now stored in app.ai.providers.
app.ai.default-provider=ollama
app.ai.default-model=qwen3:1.7b

# Chat memory (Postgres-backed, see doc/memory.md): how many of the most recent messages are sent
# to the model as raw history, and the total-stored-message count past which older turns get
# folded into a rolling summary instead of being dropped.
app.ai.max-history-messages=40
app.ai.summary-trigger-messages=80

# Spring AI 2.0 provider selection. Supported: ollama, openai, anthropic, bedrock-converse
spring.ai.model.chat=${AI_PROVIDER:ollama}

# App AI provider map
app.ai.providers.ollama.name=Ollama
app.ai.providers.ollama.base-url=${OLLAMA_BASE_URL:http://localhost:11434}
app.ai.providers.ollama.api-key=
app.ai.providers.ollama.models=qwen3:1.7b
app.ai.providers.ollama.timeout=240s

app.ai.providers.openai.name=OpenAI
app.ai.providers.openai.base-url=${OPENAI_BASE_URL:https://api.openai.com/v1}
app.ai.providers.openai.api-key=${OPENAI_API_KEY:}
app.ai.providers.openai.models=gpt-4.1-mini
app.ai.providers.openai.timeout=45s

app.ai.providers.claude.name=Claude
app.ai.providers.claude.base-url=${ANTHROPIC_BASE_URL:https://api.anthropic.com/v1}
app.ai.providers.claude.api-key=${ANTHROPIC_API_KEY:}
app.ai.providers.claude.models=claude-3.5
app.ai.providers.claude.timeout=45s

# OpenAI (active only when AI_PROVIDER=openai)
spring.ai.openai.api-key=${OPENAI_API_KEY:not-configured}
spring.ai.openai.chat.model=${OPENAI_MODEL:gpt-4.1-mini}

# Anthropic Claude (active only when AI_PROVIDER=anthropic)
spring.ai.anthropic.api-key=${ANTHROPIC_API_KEY:not-configured}
spring.ai.anthropic.chat.model=${ANTHROPIC_MODEL:claude-haiku-4-5}

# Amazon Bedrock Converse (active only when AI_PROVIDER=bedrock-converse)
spring.ai.bedrock.aws.region=${AWS_REGION:us-east-1}
spring.ai.bedrock.converse.chat.options.model=${BEDROCK_MODEL:us.anthropic.claude-haiku-4-5-20251001-v1:0}

logging.pattern.console=%-5level [%thread] %class - %msg%n
#logging.level.root=OFF
#logging.level.com.practices=ERROR

# Embeddings / semantic search (pgvector)
# transformers = self-contained, in-process ONNX embedding model (all-MiniLM-L6-v2, 384 dims).
# Explicit selection avoids colliding with the Ollama embedding autoconfiguration, which is
# also on the classpath via spring-ai-starter-model-ollama.
spring.ai.model.embedding=transformers
spring.ai.vectorstore.pgvector.initialize-schema=true
spring.ai.vectorstore.pgvector.dimensions=384
spring.ai.vectorstore.pgvector.table-name=vector_embeddings

# RAG document upload (PDF/DOCX/TXT) - default Spring Boot limit is 1MB, too small for real policy files
spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=20MB

# MCP (Model Context Protocol) server - exposes employee tools/resources/prompts to
# external AI clients (Claude Desktop, Cursor, MCP Inspector, etc) over Streamable HTTP
# at /mcp on this same app/port. protocol must be set explicitly to STREAMABLE - the
# webmvc auto-configuration's @ConditionalOnProperty does not treat the class-level
# default as "present", so the /mcp route never registers unless this is set.
spring.ai.mcp.server.protocol=STREAMABLE
spring.ai.mcp.server.name=employee-crud-mcp-server
spring.ai.mcp.server.version=1.0.0
spring.ai.mcp.server.instructions=Use get_employee, create_employee, update_employee, delete_employee, \
  employee_search and employee_statistics to manage employee records. Resources employee://all, \
  employee://{id} and employee://statistics provide read-only JSON snapshots.